<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>Life log</title>
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1D1D1F; --accent:#1D1D1F; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06); --muted:#8E8E93; --line:#E5E5EA; --sep:rgba(60,60,67,.18);
  --red:#FF3B30; --blue:#007AFF; --yellow:#FF9500; --green:#34C759; --water:#32ADE6; --purple:#AF52DE; --teal:#30B0C7; --indigo:#5856D6; --pink:#FF2D55; --mint:#30D158;
  --field:#F5F5F7; --done:rgba(52,199,89,.12); --track:#E5E5EA; --fill:rgba(118,118,128,.12); --bar:rgba(255,255,255,.88); --seg:#FFFFFF;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light only;background:#FFFFFF}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--body);letter-spacing:-.24px;font-feature-settings:"tnum";-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:12px 20px 130px}

header.top{margin:14px 0 18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:none;margin:0 0 2px;display:flex;justify-content:space-between;gap:12px}
.brand{font:700 34px/1.1 var(--body);letter-spacing:.35px;margin:2px 0 0}
.sync{font-weight:400}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:7px 2px 6px;font:500 10px/1.2 var(--body);letter-spacing:.1px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button[aria-selected="true"] svg{stroke-width:2.4}

.sub{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--field);border-radius:12px;padding:3px;margin:0 0 18px}
.sub button{border:0;background:transparent;border-radius:10px;padding:6px 8px;font-weight:500;font-size:13px;white-space:nowrap}
.sub button[aria-pressed="true"]{background:var(--seg);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.2)}

h2{font:700 22px/1.2 var(--body);letter-spacing:.3px;margin:30px 4px 12px}
h3{font:600 17px/1.3 var(--body);margin:0}
.muted{color:var(--muted)}
.scale{display:flex;gap:6px}
.scale button{width:34px;height:34px;border-radius:50%;border:0;background:var(--field);font:600 15px var(--num);color:var(--muted)}
.scale button[aria-pressed="true"]{background:var(--purple);color:#fff}
.habit{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:.5px solid var(--sep);padding:11px 0;font-size:17px}
.card-h + .habit{border-top:0}
.habit .ring{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.habit.on .ring{background:var(--teal);border-color:var(--teal)}
.habit.on .ring::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.strip i.h{background:var(--teal)}
.notice{background:rgba(255,59,48,.08);color:var(--red);border-radius:12px;padding:9px 12px;font-size:15px;font-weight:500;margin-bottom:8px}
.verse blockquote{margin:2px 0 0;font:400 21px/1.45 ui-serif,"New York","Iowan Old Style",Georgia,serif;letter-spacing:-.1px;color:var(--ink)}
.verse .ref{font-size:15px;font-weight:600;color:var(--indigo)}
a.link{text-decoration:none}
.chip.lng{background:rgba(255,59,48,.12);color:var(--red)}
.daybtn{background:var(--field);border:0;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1}
.cal{background:var(--surface);border-radius:22px;padding:12px;box-shadow:var(--shadow);border:.5px solid rgba(0,0,0,.04)}
.calh,.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh span{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px}
.calg i{aspect-ratio:1;border-radius:10px;background:var(--field);font-style:normal;display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;min-width:0}
.calg i:empty{background:none}
.calg i span{font-size:11px;color:var(--muted)}
.calg i em{font-style:normal;font:600 11px var(--num);text-align:right;white-space:nowrap;overflow:hidden}
.calg i.g{background:rgba(52,199,89,.16)} .calg i.g em{color:var(--green)}
.calg i.r{background:rgba(255,59,48,.13)} .calg i.r em{color:var(--red)}
.calg i.now{box-shadow:inset 0 0 0 1.5px var(--ink)}
.nudge{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:.5px solid var(--sep)}
.nudge:first-of-type{margin-top:6px}
.nudge > div > div:first-child{font-size:16px;line-height:1.3}
.nudge .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.nudge.high .dot{background:var(--red)} .nudge.mid .dot{background:var(--yellow)}
nav.tabs button{position:relative}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:600 11px/17px var(--body);padding:0 5px;text-align:center}
.reviewbtn .cat{white-space:nowrap}
.reviewbtn > .muted{text-align:right;font-size:13px;margin-left:12px}
.reviewbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.back::before{content:"";width:7px;height:7px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-right:4px;opacity:.6}
.back::after{display:none}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.phgrid figure{margin:0}
.phgrid img,.ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--field);display:block}
.ph{margin-top:8px}
.phgrid figcaption{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:2px 2px 0}
.tbtn{background:none;border:0;padding:4px 0;color:var(--blue);font-size:17px}
.small{font-size:15px}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:600;font-size:17px;background:var(--accent);color:#fff;transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.small{padding:7px 14px;font-size:15px;border-radius:999px}
.btn.danger{background:var(--fill);color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:22px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);border:.5px solid rgba(0,0,0,.04)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.cat{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:600;font-size:17px}
.cat i{width:30px;height:30px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.cat svg{width:17px;height:17px}
.link{background:var(--field);border:0;padding:5px 10px 5px 12px;border-radius:999px;color:var(--ink);font-size:13px;font-weight:600;display:flex;align-items:center;gap:2px}
.link::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg);margin-left:4px;opacity:.6}
.big{font:700 40px/1.05 var(--num);letter-spacing:-.5px}
.big small{font:600 17px var(--body);color:var(--muted);margin-left:4px;letter-spacing:0}
.bar{height:8px;background:#F0F0F2;border-radius:4px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:5px;margin:6px 0 0}
.field,select,textarea{border:0;background:var(--field);border-radius:10px;padding:11px 12px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{resize:vertical;min-height:70px}
label.lbl{display:block;font-size:13px;font-weight:400;color:var(--muted);margin:12px 0 5px 4px;text-transform:uppercase;letter-spacing:.2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.x{background:none;border:0;color:var(--muted);font-size:22px;width:32px;height:32px;flex:none;line-height:1}
.empty{padding:32px 24px;text-align:center;color:var(--muted);background:var(--field);border-radius:22px;font-size:15px}
.hidden{display:none!important}
.chip{display:inline-block;font:600 11px/1.6 var(--body);border-radius:5px;padding:0 6px;background:var(--fill);color:var(--muted);vertical-align:2px;letter-spacing:.2px}
.chip.trt{background:rgba(0,122,255,.14);color:var(--blue)}
.chip.pep{background:rgba(52,199,89,.16);color:var(--green)}
.num{width:100%;max-width:92px;border:0;background:var(--field);border-radius:8px;padding:8px;font:600 19px/1 var(--num);text-align:center}
details{box-sizing:border-box}
details > *{max-width:100%}
details summary{cursor:pointer;font-weight:400;color:var(--blue);list-style:none}
details summary::-webkit-details-marker{display:none}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 16px;background:var(--field);border-radius:999px;padding:4px}
.daynav button{background:var(--surface);border:0;color:var(--ink);font-size:22px;width:36px;height:36px;border-radius:50%;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.daynav b{font-weight:600;font-size:17px}

/* rings */
.rings{display:flex;align-items:center;gap:20px}
.rings svg{width:132px;height:132px;flex:none}
.legend{flex:1;min-width:0}
.legend > div{margin-bottom:6px}
.legend .l{font-size:15px;font-weight:600}
.legend .v{font:600 22px/1.15 var(--num)}
.legend .v small{font:500 15px var(--body);color:var(--muted)}

/* doses */
.dose{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:.5px solid var(--sep)}
.card-h + .dose{border-top:0}
.dose .nm{font-weight:600}
.strip{display:flex;gap:4px;margin-top:10px}
.strip i{width:14px;height:14px;border-radius:50%;background:var(--track)}
.strip i.t{background:var(--blue)}
.strip i.m{background:transparent;box-shadow:inset 0 0 0 2px var(--red)}
.strip i.n{transform:scale(.4)}

/* food */
.meal{margin-bottom:6px}
.meal-h{display:flex;justify-content:space-between;font-size:13px;text-transform:uppercase;color:var(--muted);margin:20px 4px 6px;letter-spacing:.2px}
.fi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:.5px solid var(--sep)}
.list > .fi:first-child{border-top:0}
.fi .m{font-size:13px;color:var(--muted)}
.draft td,.draft th{padding:4px}
.draft input{width:100%;min-width:52px;border:0;background:var(--field);border-radius:8px;padding:7px;text-align:center}
.draft input.nm{text-align:left;min-width:130px}
.tbl{overflow-x:auto}
.draft{border-collapse:collapse;width:100%}
.draft th{font-size:12px;color:var(--muted);text-align:left;font-weight:400}
.lib{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lib button{border:0;background:var(--field);border-radius:10px;padding:8px 12px;font-size:15px;text-align:left}
.lib button small{color:var(--muted);display:block;font-size:12px}
.micro{display:grid;grid-template-columns:110px 1fr 100px;gap:6px 10px;align-items:center;font-size:15px;margin-top:10px}
.micro .v{text-align:right;color:var(--muted);font-size:13px}

/* gym */
.wname{width:100%;border:0;background:transparent;font:700 28px/1.15 var(--body);padding:0;margin:0}
.wmeta{color:var(--muted);font-size:15px;margin:4px 0 16px}
.ex{background:var(--surface);border-radius:22px;margin:0 0 14px;overflow:hidden;box-shadow:var(--shadow);border:.5px solid rgba(0,0,0,.04)}
.ex-h{display:flex;justify-content:space-between;align-items:center;padding:12px 10px 4px 16px;gap:8px}
.ex-h h3{color:var(--c,var(--ink))}
.last{font-size:13px;color:var(--muted);padding:0 16px 8px}
table.sets{width:100%;border-collapse:collapse}
table.sets th{font-size:12px;font-weight:400;color:var(--muted);text-align:left;padding:4px 6px}
table.sets td{padding:4px 6px}
table.sets tr.isdone td{background:var(--done)}
table.sets td:first-child,table.sets th:first-child{padding-left:16px;width:38px;color:var(--muted)}
table.sets td:first-child{font:600 17px var(--num)}
.tick{width:38px;height:36px;border-radius:10px;border:0;background:var(--fill);color:var(--muted);font-weight:700}
tr.isdone .tick{background:var(--green);color:#fff}
.tick{transition:background .15s}
.ex-f{padding:8px 16px 14px}
.pr{font:600 11px/1.6 var(--body);color:var(--yellow);background:rgba(255,149,0,.15);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:middle}
.addex{display:flex;gap:8px;margin:6px 0 18px}
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:4;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 4px 18px rgba(0,0,0,.12);border-radius:14px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font:600 22px var(--num)}
.timer button{background:var(--fill);border:0;color:var(--blue);border-radius:999px;padding:5px 12px;font:600 14px var(--body);margin-left:6px}
.hist ul{list-style:none;padding:0;margin:8px 0 0}
.hist li{padding:3px 0;font-size:15px}
.hist li b{font-weight:600}
.chart{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:12px;margin-top:12px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:320px}
.stat{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font:600 28px/1.1 var(--num);font-size:clamp(17px,5.2vw,28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{color:var(--muted);font-size:13px}
.list{background:var(--surface);border-radius:22px;padding:0 20px;box-shadow:var(--shadow);border:.5px solid rgba(0,0,0,.04)}
.list > div{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:.5px solid var(--sep)}
.list > div:first-child{border-top:0}
.card .list{box-shadow:none;border:0;border-radius:14px}

/* goals */
.step{display:flex;align-items:center;gap:10px;padding:6px 0}
.step input{width:22px;height:22px;accent-color:var(--blue)}
.step.d span{text-decoration:line-through;color:var(--muted)}
.days{font-size:15px;color:var(--muted)}
input[type=checkbox]{accent-color:var(--blue)}
@media (max-width:420px){ .micro{grid-template-columns:92px 1fr 90px} .rings svg{width:112px;height:112px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow"><span id="hdate"></span><span class="sync" id="sync">Loading…</span></div>
    <h1 class="brand" id="htitle">Summary</h1>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">
  <button role="tab" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h3l2-5 4 10 2-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Summary</button>
  <button role="tab" data-tab="food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 21V3c-2 0-3.5 2.5-3.5 6.5S14 14 16 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Food</button>
  <button role="tab" data-tab="gym"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Workouts</button>
  <button role="tab" data-tab="meds"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="8.5" width="17" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="M9.5 9.5l5 5" transform="rotate(0)"/></g></svg>Health</button>
  <button role="tab" data-tab="trading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9M15 7h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Trading</button>
  <button role="tab" data-tab="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></g></svg>Goals</button>
</div></nav>
<datalist id="exlist"></datalist>
<input type="file" id="photo" accept="image/*" capture="environment" class="hidden">

<script>
(function(){
"use strict";
/* ================= constants ================= */
const COLORS=["var(--ink)"];
const DEFAULT_EX=["Bench press","Squat","Deadlift","Overhead press","Barbell row","Pull-up","Lat pulldown","Incline dumbbell press","Romanian deadlift","Leg press","Lunges","Dumbbell curl","Triceps pushdown","Lateral raise","Cable row","Hip thrust","Calf raise","Chin-up","Dips","Face pull"];
const MEALS=["Breakfast","Lunch","Dinner","Snacks"];
const MICROS=[ // key, label, unit, daily reference, isLimit
  ["fiber","Fiber","g",38],["sugar","Sugar","g",50,true],["sodium","Sodium","mg",2300,true],["potassium","Potassium","mg",3400],
  ["calcium","Calcium","mg",1000],["iron","Iron","mg",8],["magnesium","Magnesium","mg",420],["zinc","Zinc","mg",11],
  ["vitC","Vitamin C","mg",90],["vitD","Vitamin D","µg",15],["b12","Vitamin B12","µg",2.4]];
const NUTRI_KEYS=["kcal","p","c","f"].concat(MICROS.map(m=>m[0]));
const SITES=["Left glute","Right glute","Left delt","Right delt","Left quad","Right quad","Left abdomen","Right abdomen"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DEFAULT_SETTINGS={kind:"settings",id:"settings",kcal:2500,p:180,c:250,f:80,water:3000,glass:250};

/* ================= dates ================= */
const ymd=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const today=()=>ymd(Date.now());
const dayFmt=t=>new Date(typeof t==="string"?parseD(t):t).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
function dayLabel(s){ const d=diffDays(today(),s); return d===0?"Today":d===-1?"Yesterday":d===1?"Tomorrow":dayFmt(s); }

/* ================= storage ================= */
let docs={}, dayDocs={}, otherDocs={}, tradeDocs={};
const dirty=new Set();
let mode="local", col=null, sampleApi=null, canPhoto=false;
const queues={}, timers={};
const LKEY="lifelog.v1", OLDKEY="gymlog.v1";

function loadLocal(){ try{ const r=localStorage.getItem(LKEY)||localStorage.getItem(OLDKEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function saveLocal(){ try{ localStorage.setItem(LKEY,JSON.stringify(docs)); }catch(e){} }
function setSync(t){ document.getElementById("sync").textContent=t; }

let supaMark=()=>{}, authCard=()=>"", accountCard=()=>"";
function put(doc){
  docs[doc.id]=doc;
  if(mode==="local"){ saveLocal(); return; }
  if(mode==="supa"){ saveLocal(); supaMark(doc.id); return; }
  dirty.add(doc.id);
  const id=doc.id;
  const run=async()=>{
    if(!docs[id]) return;
    const body=JSON.parse(JSON.stringify(docs[id]));
    try{ await col.doc(id).set(body); setSync("Synced to your account"); }
    catch(e){
      if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,700+Math.random()*900)); try{ await col.doc(id).set(body); setSync("Synced to your account"); }catch(e2){ setSync("Couldn't save — check your connection"); } }
      else if(e&&e.code==="quota_exceeded") setSync("Storage is full — delete old entries to save new ones");
      else setSync("Couldn't save: "+(e&&e.message||"unknown error"));
    }
  };
  const q=queues[id]||(queues[id]={busy:false,again:false});
  if(q.busy){ q.again=true; return; }
  q.busy=true;
  (async()=>{ do{ q.again=false; await run(); }while(q.again); q.busy=false; dirty.delete(id); })();
}
function putSoon(doc,ms){ docs[doc.id]=doc; if(mode==="db") dirty.add(doc.id); clearTimeout(timers[doc.id]); timers[doc.id]=setTimeout(()=>put(docs[doc.id]),ms==null?500:ms); }
async function del(id){
  delete docs[id];
  if(mode==="local"){ saveLocal(); return; }
  if(mode==="supa"){ saveLocal(); supaMark(id); return; }
  try{ await col.doc(id).delete(); }catch(e){ setSync("Couldn't delete: "+(e&&e.message||"")); }
}
function rebuild(){
  const next=Object.assign({},otherDocs,tradeDocs,dayDocs);
  for(const id of dirty){ if(docs[id]) next[id]=docs[id]; }
  docs=JSON.parse(JSON.stringify(next));
}

async function initStore(){
  docs=loadLocal();
  setSync(window.claude?"Saved in this browser":"Saved on this device");
  render();
  if(!window.claude||typeof window.claude.use!=="function"){ if(typeof supaInit==="function") supaInit(); return; }
  window.claude.use("assets").then(a=>{ if(a){ assetsApi=a; safeRender(); } });
  window.claude.use("sample").then(async s=>{ if(!s) return; sampleApi=s; try{ const l=await s.limits(); canPhoto=!!(l&&l.images); if(canPhoto&&l.images.mediaTypes) document.getElementById("photo").accept=l.images.mediaTypes.join(","); }catch(e){} safeRender(); });
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const u=await user.id();
    if(!u) return;
    col=db.collection("data/users/"+u);
    mode="db"; setSync("Syncing…");
    let got=0;
    const done=()=>{ if(++got===3) setSync("Synced to your account"); };
    let f1=true,f2=true,f3=true;
    col.where("kind","==","day").orderBy("date","desc").limit(500).onSnapshot(snap=>{
      dayDocs={}; snap.docs.forEach(d=>{ if(d.exists) dayDocs[d.id]=d.data(); });
      rebuild(); if(f1){f1=false;done();} safeRender();
    },()=>setSync("Sync stopped — changes stay on this page"));
    col.where("kind","==","trade").orderBy("date","desc").limit(1000).onSnapshot(snap=>{
      tradeDocs={}; snap.docs.forEach(d=>{ if(d.exists) tradeDocs[d.id]=d.data(); });
      rebuild(); if(f3){f3=false;done();} safeRender();
    },()=>setSync("Sync stopped — changes stay on this page"));
    col.where("kind","not-in",["day","trade"]).limit(1000).onSnapshot(snap=>{
      otherDocs={}; snap.docs.forEach(d=>{ if(d.exists) otherDocs[d.id]=d.data(); });
      rebuild(); if(f2){f2=false;done();} safeRender();
    },()=>setSync("Sync stopped — changes stay on this page"));
  }catch(e){}
}

{"items":[{"name":string,"amount":string,"kcal":number,"p":number,"c":number,"f":number,"fiber":number,"sugar":number,"sodium":number,"potassium":number,"calcium":number,"iron":number,"magnesium":number,"zinc":number,"vitC":number,"vitD":number,"b12":number}]}

  try{
    const input=NUTRI_PROMPT+(images?"\n\nThe photo shows the food or its nutrition label. If it's a label, read the values per serving."+(txt?" Extra context: "+txt:""):"\n\nWhat they ate: "+txt);
    let res;
    if(sampleApi.edge){
      const body={text:txt}; if(images) body.image=await shrinkImage(images[0]);

function savingsTotal(){ return (+settings().savedBase||0)+deposits().reduce((a,x)=>a+(+x.amount||0),0); }
function weekSaved(ws){ const we=addDays(ws,6); return deposits().filter(x=>x.date>=ws&&x.date<=we).reduce((a,x)=>a+(+x.amount||0),0); }
function saveStreak(){ const t=+settings().weekly||200; let ws=weekStart(today()), n=0; if(weekSaved(ws)<t) ws=addDays(ws,-7); while(weekSaved(ws)>=t&&n<520){ n++; ws=addDays(ws,-7); } return n; }

/* week review */
function weekStats(end){
  const days=Array.from({length:7},(_,k)=>addDays(end,k-6)), s=settings();
  const logged=days.filter(d=>(dayDoc(d).food||[]).length);
  const kc=avg(logged.map(d=>dayTotals(d).kcal)), pr=avg(logged.map(d=>dayTotals(d).p));
  const wat=avg(days.map(d=>dayDoc(d).water||0).filter(x=>x>0));
  const wk=finished().filter(w=>{ const d=ymd(w.startedAt); return d>=days[0]&&d<=end; }).length;
  const planned=days.filter(d=>planFor(d)).length;
  let due=0,taken=0; meds().forEach(m=>days.forEach(d=>{ if(isDue(m,d)&&d<=today()){ due+=perDay(m); taken+=Math.min(perDay(m),takenList(m,d).length); } }));
  const b=bws(); const inW=b.filter(x=>x.date>=days[0]&&x.date<=end); const wNow=inW[0]?+inW[0].kg:null; const before=b.find(x=>x.date<days[0]); const wDelta=wNow!=null&&before?wNow-(+before.kg):null;
  const hs=habits(); const hp=hs.length?days.reduce((a,d)=>a+hs.filter(h=>habitDone(h,d)).length,0)/(hs.length*7):null;
  const saved=deposits().filter(x=>x.date>=days[0]&&x.date<=end).reduce((a,x)=>a+(+x.amount||0),0);
  const cis=days.map(d=>dayDoc(d).checkin).filter(Boolean);
  const ci={}; CHECK.forEach(([k])=>ci[k]=avg(cis.filter(c=>c[k]).map(c=>c[k])));
  return {days,kc,pr,wat,wk,planned,due,taken,wNow,wDelta,hp,saved,ci,logged:logged.length};
}
function delta(a,b,d,unit,goodUp){ if(a==null||b==null) return ""; const x=a-b; if(Math.abs(x)<Math.pow(10,-(d||0))/2) return `<span class="muted"> · same as last week</span>`; const good=goodUp==null?null:(goodUp?x>0:x<0); return ` <span style="color:${good==null?"var(--muted)":good?"var(--green)":"var(--red)"}">${x>0?"▲":"▼"} ${fmt(Math.abs(x),d)}${unit||""}</span>`; }
function renderReview(){
  const s=settings(), A=weekStats(today()), B=weekStats(addDays(today(),-7));

  if(sg&&sg.deadline){ const need=(+sg.target-savingsTotal())/(Math.max(1,diffDays(today(),sg.deadline))/7); onTrack.push(`${esc(sg.title)}: you need <b>${euro(Math.max(0,need))} per week</b>, this week you saved <b>${euro(A.saved)}</b>.`); }
  return `<button class="link back" data-act="go" data-to="today">Summary</button>
  <p class="muted small" style="margin:12px 4px 14px">${dayFmt(A.days[0])} – ${dayFmt(A.days[6])}, compared with the 7 days before.</p>
  ${onTrack.length?`<section class="card"><div class="card-h">${cat("goals","On track?","var(--yellow)")}</div>${onTrack.map(t=>`<p class="small" style="margin:6px 0">${t}</p>`).join("")}</section>`:""}
  <h2>Body &amp; training</h2><div class="list">
    ${row("Workouts",`${A.wk}${A.planned?" / "+A.planned+" planned":""}`,delta(A.wk,B.wk,0,"",true))}

  </div>
  <h2>Nutrition</h2><div class="list">
    ${row("Avg calories",A.kc!=null?fmt(A.kc,0)+" kcal":"—",delta(A.kc,B.kc,0))}
    ${row("Avg protein",A.pr!=null?fmt(A.pr,0)+" g":"—",delta(A.pr,B.pr,0," g",true))}
    ${row("Days logged",A.logged+" / 7")}
    ${row("Avg water",A.wat!=null?fmt(A.wat/1000,1)+" L":"—",delta(A.wat!=null?A.wat/1000:null,B.wat!=null?B.wat/1000:null,1," L",true))}
  </div>
  <h2>Mind &amp; habits</h2><div class="list">
    ${CHECK.map(([k,l])=>row(l,A.ci[k]!=null?fmt(A.ci[k])+" / 5":"—",delta(A.ci[k],B.ci[k],1,"",true))).join("")}
    ${row("Habits done",A.hp!=null?Math.round(A.hp*100)+"%":"—",A.hp!=null&&B.hp!=null?delta(A.hp*100,B.hp*100,0,"%",true):"")}
  </div>
  <h2>Trading</h2><div class="list">
    ${(()=>{ const ta=trades().filter(t=>t.date>=A.days[0]&&t.date<=A.days[6]), tb=trades().filter(t=>t.date>=B.days[0]&&t.date<=B.days[6]); const sa=tStats(ta), sb=tStats(tb);
      return row("Result",ta.length?`<span style="color:${pnlColor(sa.net)}">${eurS(sa.net)}</span>`:"—",tb.length&&ta.length?` <span class="muted">(last week ${eurS(sb.net)})</span>`:"")+row("Trades",ta.length+(sa.win!=null?` · ${Math.round(sa.win*100)}% win`:""))+row("Followed plan",ta.filter(t=>t.followed!=null).length?`${ta.filter(t=>t.followed===true).length} / ${ta.filter(t=>t.followed!=null).length}`:"—"); })()}
  </div>
  <h2>Money</h2><div class="list">
    ${row("Saved",euro(A.saved),` <span class="muted">of ${euro(+s.weekly||200)}</span>`)}
    ${row("Total saved",euro(savingsTotal()))}
  </div>`;
}

function verseFor(date){
  const n=Math.floor(parseD(date).getTime()/864e5);
  // spread consecutive days across the list so neighbours differ in theme
  return VERSES[((n*37)%VERSES.length+VERSES.length)%VERSES.length];
}
function verseCard(){
  const [ref,txt]=verseFor(day);
  const chapter=ref.replace(/[:].*$/,"").replace(/–.*$/,"");
  const hasHabit=habits().some(h=>/bible|bijbel|pray|bid|devotion|stille tijd/i.test(h.name));
  return `<section class="card verse"><div class="card-h">${cat("cross","Verse of the day","var(--indigo)")}</div>
    <blockquote>${esc(txt)}</blockquote>
    <div class="row between" style="margin-top:12px"><span class="ref">${esc(ref)}</span><a class="link" href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(chapter)}&amp;version=KJV" target="_blank" rel="noopener">Read chapter</a></div>
    ${hasHabit?"":`<button class="btn ghost small" style="margin-top:12px" data-act="biblehabit">Add “Read the Bible” as a daily habit</button>`}
  </section>`;
}

let tradeSub="journal", tradeEdit=null, tradePeriod="30", calMonth=null;
const EMOTIONS=["Calm","Confident","FOMO","Fear","Greedy","Revenge","Bored"];
const trades=()=>Object.values(docs).filter(d=>d.kind==="trade").sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
const eur=n=>(n<0?"−":"")+"€"+Math.abs(n).toLocaleString("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2});
const eurS=n=>(n>0?"+":"")+eur(n);
const pnlColor=n=>n>0?"var(--green)":n<0?"var(--red)":"var(--muted)";
const netOf=t=>(+t.pnl||0)-(+t.fees||0);
function dayPnl(d){ return trades().filter(t=>t.date===d).reduce((a,t)=>a+netOf(t),0); }
function tStats(list){
  const n=list.length, nets=list.map(netOf), wins=nets.filter(x=>x>0), losses=nets.filter(x=>x<0);
  const gw=wins.reduce((a,x)=>a+x,0), gl=-losses.reduce((a,x)=>a+x,0);
  const rs=list.filter(t=>+t.risk>0).map(t=>netOf(t)/+t.risk);
  return {n,net:nets.reduce((a,x)=>a+x,0),win:n?wins.length/n:null,avgW:wins.length?gw/wins.length:null,avgL:losses.length?-gl/losses.length:null,
    pf:gl>0?gw/gl:(gw>0?Infinity:null),exp:n?nets.reduce((a,x)=>a+x,0)/n:null,avgR:rs.length?avg(rs):null,best:n?Math.max(...nets):null,worst:n?Math.min(...nets):null};
}

    <div class="row between"><div class="big" style="color:${pnlColor(p)}">${list.length?eurS(p):"€0"}</div><span class="muted small">${list.length} ${list.length===1?"trade":"trades"}</span></div>

}

function renderTradeStats(){
  const T0=trades(), cut=tradePeriod==="all"?"0000":addDays(today(),-(+tradePeriod)+1), T=T0.filter(t=>t.date>=cut);
  const per=[["30","30 days"],["90","90 days"],["all","All time"]];
  const head=`<div class="sub">${per.map(([k,l])=>`<button data-tper="${k}" aria-pressed="${tradePeriod===k}">${l}</button>`).join("")}</div>`;
  if(!T.length) return head+`<div class="empty">No trades in this period.</div>`;
  const S=tStats(T);
  const asc=T.slice().reverse(); let run=0; const byD={}; asc.forEach(t=>{ run+=netOf(t); byD[t.date]=run; });
  const pts=Object.keys(byD).sort().map(d=>({t:parseD(d).getTime(),v:byD[d],label:eurS(byD[d])}));
  const group=(key,labelFn)=>{ const g={}; T.forEach(t=>{ const k=labelFn?labelFn(t):t[key]; if(k==null||k==="") return; (g[k]=g[k]||[]).push(t); }); return Object.entries(g).map(([k,v])=>[k,tStats(v)]).sort((a,b)=>b[1].net-a[1].net); };
  const table=(title,rows)=>rows.length?`<h2>${title}</h2><div class="list">${rows.map(([k,st])=>`<div><span><span style="font-weight:600">${esc(k)}</span><br><span class="muted" style="font-size:13px">${st.n} ${st.n===1?"trade":"trades"} · ${Math.round(st.win*100)}% win</span></span><b style="color:${pnlColor(st.net)};font-weight:600">${eurS(st.net)}</b></div>`).join("")}</div>`:"";
  const plan=group(null,t=>t.followed===true?"Followed plan":t.followed===false?"Broke plan":null);
  const fp=plan.find(x=>x[0]==="Followed plan"), bp=plan.find(x=>x[0]==="Broke plan");
  const pfTxt=S.pf===Infinity?"∞":S.pf==null?"—":fmt(S.pf,2);
  return head+`<section class="card"><div class="muted small">Net result</div><div class="big" style="color:${pnlColor(S.net)}">${eurS(S.net)}</div><div class="muted" style="font-size:13px">${S.n} trades, after fees</div>
    ${pts.length>1?`<div style="margin-top:10px">${chart(pts,"Equity curve",S.net>=0?"var(--green)":"var(--red)")}</div>`:""}</section>
  <div class="grid3">
    <div class="stat"><b>${Math.round(S.win*100)}%</b><small>Win rate</small></div>
    <div class="stat"><b>${pfTxt}</b><small>Profit factor</small></div>
    <div class="stat"><b style="color:${pnlColor(S.exp)}">${eurS(S.exp)}</b><small>Per trade</small></div>
    <div class="stat"><b style="color:var(--green)">${S.avgW!=null?eur(S.avgW):"—"}</b><small>Avg win</small></div>
    <div class="stat"><b style="color:var(--red)">${S.avgL!=null?eur(S.avgL):"—"}</b><small>Avg loss</small></div>
    <div class="stat"><b>${S.avgR!=null?fmt(S.avgR,2)+"R":"—"}</b><small>Avg R</small></div>
  </div>
  ${fp&&bp?`<section class="card" style="margin-top:14px"><div class="card-h">${cat("chart","Discipline","var(--indigo)")}</div><p class="small" style="margin:0">When you follow your plan you make <b style="color:${pnlColor(fp[1].exp)}">${eurS(fp[1].exp)}</b> per trade. When you break it: <b style="color:${pnlColor(bp[1].exp)}">${eurS(bp[1].exp)}</b>.</p></section>`:""}
  ${table("By setup",group("setup"))}${table("By market",group("symbol"))}${table("By feeling",group("emotion"))}
  ${table("By weekday",group(null,t=>DAYNAME[parseD(t.date).getDay()]))}`;
}
function renderTradeCal(){
  const m=calMonth||today().slice(0,7); const [y,mo]=m.split("-").map(Number);
  const first=new Date(y,mo-1,1,12), days=new Date(y,mo,0).getDate(), lead=(first.getDay()+6)%7;
  const cells=[]; for(let i=0;i<lead;i++) cells.push(`<i></i>`);
  let tot=0,green=0,red=0;
  for(let d=1;d<=days;d++){ const ds=`${m}-${String(d).padStart(2,"0")}`; const has=trades().some(t=>t.date===ds); const p=has?dayPnl(ds):null; if(has){ tot+=p; if(p>0) green++; else if(p<0) red++; }
    cells.push(`<i class="${has?(p>0?"g":p<0?"r":"z"):""}${ds===today()?" now":""}"><span>${d}</span>${has?`<em>${Math.abs(p)>=1000?(p/1000).toFixed(1)+"k":Math.round(p)}</em>`:""}</i>`); }
  return `<div class="row between" style="margin-bottom:12px"><button class="daybtn" data-act="calprev" aria-label="Previous month">‹</button><b>${first.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><button class="daybtn" data-act="calnext" aria-label="Next month">›</button></div>
  <div class="cal"><div class="calh">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<span>${x}</span>`).join("")}</div><div class="calg">${cells.join("")}</div></div>
  <div class="grid3" style="margin-top:14px"><div class="stat"><b style="color:${pnlColor(tot)}">${eurS(tot)}</b><small>Month</small></div><div class="stat"><b style="color:var(--green)">${green}</b><small>Green days</small></div><div class="stat"><b style="color:var(--red)">${red}</b><small>Red days</small></div></div>`;
}

function essentials(){
  // daily basics for the score: [label, done]
  const s=settings(), d=dayDoc(today()), t=dayTotals(today()), list=[];
  meds().filter(m=>isDue(m,today())).forEach(m=>list.push([m.name,takenList(m,today()).length>=perDay(m)]));
  list.push(["Water",(d.water||0)>=s.water]);
  list.push(["Protein",t.p>=s.p*.95]);
  list.push(["Calories",t.kcal>=s.kcal*.9]);
  if(planFor(today())) list.push(["Workout",finished().some(w=>ymd(w.startedAt)===today())]);
  list.push(["Check-in",CHECK.every(([k])=>(d.checkin||{})[k])]);
  habits().forEach(h=>list.push([h.name,habitDone(h,today())]));
  return list;
}
function nudges(){
  const now=new Date(), h=now.getHours()+now.getMinutes()/60, s=settings(), d=dayDoc(today()), t=dayTotals(today()), T=today(), out=[];
  const add=(key,level,title,sub,btn)=>out.push({key,level,title,sub,btn});
  // meds
  meds().filter(m=>isDue(m,T)).forEach(m=>{ const left=perDay(m)-takenList(m,T).length; if(left<=0) return;
    const [hh,mm]=(m.time||"").split(":").map(Number); const late=m.time&&h>hh+(mm||0)/60;
    if(late||(!m.time&&h>=12)) add("med-"+m.id,late?"high":"mid",`${late?"Overdue: ":""}${m.name} ${doseLabel(m)}`,m.time?`Planned at ${m.time}`:"Due today",`<button class="btn small" data-act="take" data-id="${m.id}">Taken</button>`); });
  // trading limit
  const lim=+s.maxLoss||0, tp=dayPnl(T); if(lim&&tp<=-lim) add("trade-limit","high","Stop trading for today",`You're at ${eurS(tp)}, your limit is ${eur(lim)}.`,"");
  // workout
  const tpPlan=planFor(T), w=active();
  if(w&&Date.now()-w.startedAt>3*3600e3) add("wk-open","mid","Workout still open",`${w.name} started ${dur(Date.now()-w.startedAt)} ago.`,`<button class="btn small" data-act="go" data-to="gym">Finish</button>`);
  else if(tpPlan&&!w&&!finished().some(x=>ymd(x.startedAt)===T)&&h>=16) add("wk-plan",h>=20?"high":"mid",`${tpPlan.name||"Workout"} is planned today`,"Not done yet.",`<button class="btn small" data-act="startplan">Start</button>`);
  // food
  if(!(d.food||[]).length&&h>=13) add("food-none","mid","No food logged yet today","Log what you've eaten so far.",`<button class="btn small" data-act="go" data-to="food">Log</button>`);
  else if(h>=18&&t.p<s.p*.75) add("protein","mid",`${fmt(s.p-t.p,0)} g protein to go`,`${fmt(t.p,0)} of ${s.p} g so far.`,`<button class="btn small" data-act="go" data-to="food">Log</button>`);
  if(h>=19&&(d.food||[]).length&&t.kcal<s.kcal*.7) add("kcal","mid",`${fmt(s.kcal-t.kcal,0)} kcal to go`,`You're at ${fmt(t.kcal,0)} of ${s.kcal}.`,"");
  // water pace (07:00–22:00)
  const exp=s.water*clamp((h-7)/15,0,1), wat=d.water||0;
  if(h>=11&&wat<exp-500) add("water","low",`Behind on water`,`${fmt(wat/1000,2)} L so far, aim for about ${fmt(exp/1000,1)} L by now.`,`<button class="btn small" data-act="water" data-ml="${s.glass}">+ ${fmt(s.glass,0)} ml</button>`);
  // check-in + habits (evening)
  if(h>=20&&!CHECK.every(([k])=>(d.checkin||{})[k])) add("checkin","mid","Fill in today's check-in","Takes 10 seconds.","");
  const open=habits().filter(x=>!habitDone(x,T));
  if(h>=19&&open.length) add("habits","mid",`${open.length} ${open.length===1?"habit":"habits"} left today`,open.map(x=>x.name).join(", "),"");
  // weigh-in
  const b=bws(); const wg=goals().find(g=>g.link==="bodyweight");
  if(wg&&(!b.length||diffDays(b[0].date,T)>=7)) add("weigh","low",b.length?`Weigh in, last time ${diffDays(b[0].date,T)} days ago`:"Log your weight",`Keeps your ${fmt(wg.target)} ${esc(wg.unit)} goal on track.`,`<button class="btn small" data-act="gogym-body">Log</button>`);
  // blood test
  if(s.nextLab){ const n=diffDays(T,s.nextLab); if(n<=3) add("lab",n<0?"high":"mid",n<0?"Blood test overdue":n===0?"Blood test today":`Blood test in ${n} ${n===1?"day":"days"}`,dayFmt(s.nextLab),""); }
  // savings (from Friday)
  const wd=parseD(T).getDay(), wk=+s.weekly||200, sv=weekSaved(weekStart(T));
  if((wd===5||wd===6||wd===0)&&sv<wk) add("save",wd===0?"high":"mid",`Save ${euro(wk-sv)} this week`,`${euro(sv)} of ${euro(wk)} so far. The week ends Sunday.`,`<button class="btn small" data-act="dep" data-amt="${wk-sv}">Saved</button>`);
  // groceries
  const mo=T.slice(0,7), spent=spends().filter(x=>x.date.slice(0,7)===mo).reduce((a,x)=>a+(+x.amount||0),0);
  if(spent>(+s.groceries||200)) add("groc","low","Over your groceries budget",`${euro2(spent)} of ${euro(+s.groceries||200)} this month.`,"");
  const dis=new Set(d.dismissed||[]);

  return out.filter(n=>!dis.has(n.key)).sort((a,b)=>rank[a.level]-rank[b.level]);
}

function idbDo(mode,fn){ return new Promise((res,rej)=>{ const tx=idb.transaction("p",mode); const st=tx.objectStore("p"); const r=fn(st); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); }); }

function lastSession(name,ex){ for(const w of finished()){ if(w.id===ex) continue; const e=w.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase()); if(e&&e.sets.some(s=>s.done)) return {w,e}; } return null; }
function bestE1(name,ex){ let b=0; finished().forEach(w=>{ if(w.id===ex) return; w.exercises.forEach(e=>{ if(e.name.toLowerCase()!==name.toLowerCase()) return; e.sets.forEach(s=>{ if(s.done) b=Math.max(b,e1rm(+s.w,+s.r)); }); }); }); return b; }

function renderProgress(){

function chart(pts,title,color){
  if(pts.length<2) return `<p class="muted" style="margin:8px">Log at least two entries to draw a line.</p>`;
  const W=600,H=220,p={l:44,r:14,t:14,b:28};
  const vs=pts.map(x=>x.v); let lo=Math.min(...vs),hi=Math.max(...vs); const pad=Math.max((hi-lo)*.15,1.5); lo-=pad; hi+=pad;
  const X=i=>p.l+i*(W-p.l-p.r)/(pts.length-1), Y=v=>p.t+(hi-v)*(H-p.t-p.b)/(hi-lo);
  const ticks=[0,1,2,3].map(k=>lo+(hi-lo)*k/3), step=Math.ceil(pts.length/6);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} over time">
    ${ticks.map(t=>`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${p.l-6}" y="${Y(t)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="Barlow,sans-serif">${Math.round(t)}</text>`).join("")}
    <path d="${pts.map((q,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(q.v).toFixed(1)).join(" ")}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>
    ${pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q.v)}" r="4.5" fill="var(--surface)" stroke="${color}" stroke-width="2.5"><title>${dayFmt(q.t)}: ${esc(q.label)}</title></circle>`).join("")}
    ${pts.map((q,i)=>(i%step===0||i===pts.length-1)?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Barlow,sans-serif">${new Date(q.t).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</text>`:"").join("")}
  </svg>`;
}

/* ================= events ================= */
function newMed(){ return {kind:"med",id:uid("m"),name:"",type:"TRT",route:"injection",dose:"",unit:"mg",mode:"interval",every:3,days:[],perDay:1,time:"",start:today(),end:"",sites:true,notes:"",archived:false}; }
function newGoal(){ return {kind:"goal",id:uid("g"),title:"",type:"number",deadline:"",start:"",target:"",unit:"",current:null,log:[],steps:[],done:false}; }
function readForm(){
  if(medEdit){ document.querySelectorAll("[data-m]").forEach(el=>{ const k=el.dataset.m; medEdit[k]= el.type==="checkbox"?el.checked:el.value; }); medEdit.days=[...document.querySelectorAll("[data-day]")].filter(x=>x.checked).map(x=>+x.dataset.day); }
  if(goalEdit){ document.querySelectorAll("[data-g]").forEach(el=>{ const k=el.dataset.g; if(k==="link") goalEdit.link=el.value||null; else if(k==="stepsText"){ const old=goalEdit.steps||[]; goalEdit.steps=el.value.split("\n").map(t=>t.trim()).filter(Boolean).map(t=>({t,done:!!(old.find(o=>o.t===t)||{}).done})); } else goalEdit[k]=el.value; }); }
}

document.addEventListener("click",ev=>{
  const tb=ev.target.closest("nav.tabs button"); if(tb){ tab=tb.dataset.tab; medEdit=null; goalEdit=null; planEdit=null; labForm=false; tradeEdit=null; render(); window.scrollTo(0,0); return; }
  const gs=ev.target.closest("[data-gsub]"); if(gs){ gymSub=gs.dataset.gsub; render(); return; }
  const hs=ev.target.closest("[data-hsub]"); if(hs){ healthSub=hs.dataset.hsub; render(); return; }
  const ts=ev.target.closest("[data-tsub]"); if(ts){ tradeSub=ts.dataset.tsub; render(); return; }
  const tp=ev.target.closest("[data-tper]"); if(tp){ tradePeriod=tp.dataset.tper; render(); return; }
  const os=ev.target.closest("[data-osub]"); if(os){ goalSub=os.dataset.osub; render(); return; }
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, i=+b.dataset.i, j=+b.dataset.j, id=b.dataset.id, w=active(), s=settings();
  switch(act){
    case "go": tab=b.dataset.to; render(); window.scrollTo(0,0); break;
    case "tradenew": tradeEdit={kind:"trade",id:uid("t"),date:today(),symbol:(trades()[0]||{}).symbol||"",dir:"Long",setup:"",pnl:"",fees:"",risk:"",emotion:"",followed:null,notes:""}; render(); window.scrollTo(0,0); break;
    case "tradeedit": tradeEdit=JSON.parse(JSON.stringify(docs[id])); render(); window.scrollTo(0,0); break;
    case "tradecancel": tradeEdit=null; render(); break;
    case "tfollow": readTradeForm(); tradeEdit.followed= b.dataset.v==="yes" ? (tradeEdit.followed===true?null:true) : (tradeEdit.followed===false?null:false); render(); break;
    case "tradesave": { readTradeForm(); const t=tradeEdit; const pnl=numIn(t.pnl); if(pnl==null){ alert("Enter the result in euros, e.g. 120 or -80."); return; }
      t.pnl=pnl; t.fees=numIn(t.fees)||0; t.risk=numIn(t.risk)||""; t.symbol=(t.symbol||"").trim().toUpperCase(); t.setup=(t.setup||"").trim(); t.created=t.created||Date.now(); t.date=t.date||today();
      put(t); tradeEdit=null; render(); break; }
    case "tradedel": if(confirm("Delete this trade?")){ del(tradeEdit.id); tradeEdit=null; render(); } break;
    case "calprev": case "calnext": { const m=calMonth||today().slice(0,7); const [y,mo]=m.split("-").map(Number); const d=new Date(y,mo-1+(act==="calnext"?1:-1),1); calMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); render(); break; }
    case "dismiss": editDay(today(),d=>{ d.dismissed=(d.dismissed||[]).concat([b.dataset.key]); },300); render(); break;
    case "gogym-body": tab="gym"; gymSub="body"; render(); window.scrollTo(0,0); break;
    case "export": { const data=JSON.stringify({app:"lifelog",version:1,exported:new Date().toISOString(),docs:Object.fromEntries(Object.entries(docs).filter(([k,v])=>v.kind!=="photo"))}); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download="lifelog-backup-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); break; }
    case "import": $("#importfile").click(); break;
    case "gogoal": tab="goals"; goalSub=b.dataset.sub; goalEdit=null; render(); window.scrollTo(0,0); break;
    case "ci": { const k=b.dataset.k, n=+b.dataset.n; editDay(day,d=>{ d.checkin=d.checkin||{}; d.checkin[k]= d.checkin[k]===n?null:n; },300); render(); break; }
    case "biblehabit": put({kind:"habit",id:uid("h"),name:"Read the Bible",created:Date.now()}); render(); break;
    case "habit": editDay(day,d=>{ d.habits=d.habits||{}; if(d.habits[id]) delete d.habits[id]; else d.habits[id]=true; },300); render(); break;
    case "habadd": { const inp=$("#hab-new"), n=(inp.value||"").trim(); if(!n){ inp.focus(); return; } put({kind:"habit",id:uid("h"),name:n,created:Date.now()}); render(); const ni=$("#hab-new"); ni&&ni.focus(); break; }
    case "habrm": if(confirm("Remove this habit? Its history is kept.")){ put(Object.assign({},docs[id],{archived:true})); render(); } break;
    case "labnew": labForm=true; render(); break;
    case "labcancel": labForm=false; render(); break;
    case "labsave": { const values={}; LABS.forEach(([k])=>{ const v=numIn(($("#lab-"+k)||{}).value||""); if(v!=null) values[k]=v; }); if(!Object.keys(values).length){ alert("Fill in at least one value."); return; } put({kind:"lab",id:uid("lab"),date:$("#lab-date").value||today(),values,notes:($("#lab-notes").value||"").trim()}); labForm=false; render(); break; }
    case "labdel": if(confirm("Delete this blood test?")){ del(id); render(); } break;
    case "setnextlab": { const st=settings(); st.nextLab=$("#nextlab").value||""; put(st); render(); break; }
    case "dep": put({kind:"deposit",id:uid("dep"),date:today(),amount:+b.dataset.amt}); render(); break;
    case "depcustom": { const v=numIn($("#dep-amt").value||""); if(!v){ $("#dep-amt").focus(); return; } put({kind:"deposit",id:uid("dep"),date:today(),amount:v}); render(); break; }
    case "depdel": if(confirm("Delete this deposit?")){ del(id); render(); } break;
    case "spadd": { const v=numIn($("#sp-amt").value||""); if(!v){ $("#sp-amt").focus(); return; } put({kind:"spend",id:uid("sp"),date:today(),amount:v,cat:"groceries"}); render(); break; }
    case "spdel": del(id); render(); break;
    case "phadd": $("#phfile").click(); break;
    case "phdel": if(confirm("Delete this photo for good?")){ const ph=docs[id]; del(id); if(ph&&ph.local&&idb){ idbDo("readwrite",st=>st.delete(ph.assetId)).catch(()=>{}); } else if(assetsApi&&ph) assetsApi.delete(ph.assetId).catch(()=>{}); render(); } break;
    case "dayprev": day=addDays(day,-1); render(); break;
    case "daynext": day=addDays(day,1); render(); break;
    case "water": editDay(day,d=>{ d.water=Math.max(0,(d.water||0)+(+b.dataset.ml)); },300); render(); break;
    /* food */
    case "lookup": lookup(null); break;
    case "photo": $("#photo").click(); break;
    case "manual": draft=(draft||[]).concat([normItem({name:foodText.trim()||"",amount:""})]); render(); break;
    case "rmdraft": draft.splice(i,1); if(!draft.length) draft=null; render(); break;
    case "canceldraft": draft=null; draftErr=""; render(); break;
    case "adddraft": {
      const items=draft.filter(x=>x.name.trim());
      editDay(day,d=>{ items.forEach(it=>d.food.push(Object.assign({id:uid("f"),meal:foodMeal},it))); },0);
      if(saveToLib) items.forEach(it=>{ const k=libKey(it.name); const ex=docs[k]; put(Object.assign({kind:"foodlib",id:k,used:(ex&&ex.used||0)+1},it)); });
      draft=null; foodText=""; draftErr=""; render(); break;
    }
    case "libadd": { const x=docs[id]; if(!x) return; const it={}; ["name","amount"].concat(NUTRI_KEYS).forEach(k=>it[k]=x[k]); editDay(day,d=>d.food.push(Object.assign({id:uid("f"),meal:foodMeal},it)),0); put(Object.assign({},x,{used:(x.used||0)+1})); render(); break; }
    case "rmfood": editDay(day,d=>{ d.food=d.food.filter(f=>f.id!==id); },0); render(); break;
    case "copyday": { const prev=dayDoc(addDays(day,-1)).food||[]; if(!prev.length){ alert("Nothing logged on the previous day."); return; } editDay(day,d=>prev.forEach(f=>d.food.push(Object.assign({},f,{id:uid("f")}))),0); render(); break; }
    /* meds */
    case "take": case "logextra": {
      const m=docs[id]; const sel=document.querySelector(`[data-site="${id}"]`);
      const date= act==="take"?day:day;
      const site= m.route==="injection"&&m.sites? (sel?sel.value:nextSite(m)) : null;
      const at= date===today()?Date.now():parseD(date).getTime();
      editDay(date,d=>{ d.doses[id]=(d.doses[id]||[]).concat([{at,site}]); },0); render(); break;
    }
    case "untake": editDay(day,d=>{ const a=d.doses[id]||[]; a.pop(); if(a.length) d.doses[id]=a; else delete d.doses[id]; },0); render(); break;
    case "newmed": medEdit=newMed(); render(); window.scrollTo(0,0); break;
    case "editmed": medEdit=JSON.parse(JSON.stringify(docs[id])); render(); window.scrollTo(0,0); break;
    case "cancelmed": medEdit=null; render(); break;
    case "savemed": {
      readForm(); const m=medEdit;
      if(!m.name.trim()){ alert("Give it a name."); return; }
      if(numIn(m.dose)==null){ alert("Enter the dose as a number."); return; }
      if(m.mode==="weekdays"&&!m.days.length){ alert("Pick at least one day."); return; }
      m.dose=numIn(m.dose); m.every=Math.max(1,parseInt(m.every,10)||1); m.perDay=Math.max(1,parseInt(m.perDay,10)||1); m.name=m.name.trim();
      put(m); medEdit=null; render(); break;
    }
    case "archmed": readForm(); medEdit.archived=!medEdit.archived; if(medEdit.archived&&!medEdit.end) medEdit.end=today(); if(!medEdit.archived) medEdit.end=""; put(medEdit); medEdit=null; render(); break;
    case "delmed": if(confirm("Delete this medication? Doses you already logged stay in your history.")){ del(medEdit.id); medEdit=null; render(); } break;
    /* goals */
    case "newgoal": goalEdit=newGoal(); render(); window.scrollTo(0,0); break;
    case "editgoal": goalEdit=JSON.parse(JSON.stringify(docs[id])); render(); window.scrollTo(0,0); break;
    case "cancelgoal": goalEdit=null; render(); break;
    case "savegoal": {
      readForm(); const g=goalEdit;
      if(!g.title.trim()){ alert("Give the goal a name."); return; }
      if(g.type==="number"){ if(numIn(g.target)==null){ alert("Enter a target number."); return; } g.target=numIn(g.target); g.start= g.start===""?(g.link==="bodyweight"?null:0):numIn(g.start); }
      g.title=g.title.trim(); put(g); goalEdit=null; render(); break;
    }
    case "delgoal": if(confirm("Delete this goal?")){ del(goalEdit.id); goalEdit=null; render(); } break;
    case "goalupd": {
      const g=docs[id], v=numIn(($("#gv-"+id)||{}).value); if(v==null) return;
      if(g.link==="bodyweight"){ const ex=bws().find(x=>x.date===today()); put({kind:"bw",id:ex?ex.id:uid("b"),date:today(),kg:v}); }
      else { const n=JSON.parse(JSON.stringify(g)); n.current=v; n.log=(n.log||[]).filter(x=>x.date!==today()).concat([{date:today(),v}]); put(n); }
      render(); break;
    }
    /* gym */
    case "start": startWorkout(null); break;
    case "startplan": { if(active()){ tab="gym"; gymSub="workout"; render(); return; } const tp=planFor(today()); if(tp) startFromPlan(tp); break; }
    case "go-plan": gymSub="plan"; render(); break;
    case "editplan": { const d=+b.dataset.dow; const ex=plan().days[d]; planEdit={dow:d,rest:!!(ex&&ex.rest),name:ex&&ex.name||"",exercises:ex&&ex.exercises?JSON.parse(JSON.stringify(ex.exercises)):[]}; tab="gym"; gymSub="plan"; render(); window.scrollTo(0,0); break; }
    case "pladd": { readPlanForm(); const inp=$("#pl-new"); const n=(inp.value||"").trim(); if(!n){ inp.focus(); return; } planEdit.exercises.push({name:n,sets:3,reps:10}); render(); const ni=$("#pl-new"); ni&&ni.focus(); break; }
    case "plrm": readPlanForm(); planEdit.exercises.splice(i,1); render(); break;
    case "plup": if(i>0){ readPlanForm(); const e=planEdit.exercises; [e[i-1],e[i]]=[e[i],e[i-1]]; render(); } break;
    case "plcancel": planEdit=null; render(); break;
    case "plsave": savePlan(); break;
    case "plclear": { const p=JSON.parse(JSON.stringify(plan())); delete p.days[planEdit.dow]; put(p); planEdit=null; render(); break; }
    case "plcopy": $("#pl-copyto").classList.toggle("hidden"); break;
    case "plcopygo": savePlan([...document.querySelectorAll("[data-copy]")].filter(x=>x.checked).map(x=>+x.dataset.copy)); break;
    case "repeat": if(active()&&!confirm("You already have a workout in progress. Start a new one anyway?")) return; startWorkout(docs[id]); break;
    case "addex": addExercise(); break;
    case "rmex": if(confirm("Remove "+w.exercises[i].name+"?")){ w.exercises.splice(i,1); put(w); render(); } break;
    case "addset": { const ss=w.exercises[i].sets, l=ss[ss.length-1]; ss.push({w:l?l.w:"",r:l?l.r:"",done:false}); put(w); render(); break; }
    case "rmset": w.exercises[i].sets.splice(j,1); put(w); render(); break;
    case "tick": { const st=w.exercises[i].sets[j]; st.done=!st.done; put(w); if(st.done) startRest(90); render(); break; }
    case "rest+": restEnd=Math.max(restEnd,Date.now())+30000; updateTimer(); break;
    case "restx": restEnd=0; updateTimer(); break;
    case "finish": { if(!w.exercises.some(e=>e.sets.some(x=>x.done))&&!confirm("No sets are ticked off. Finish anyway?")) return; w.finishedAt=Date.now(); restEnd=0; put(w); gymSub="history"; render(); window.scrollTo(0,0); break; }
    case "discard": if(confirm("Discard this workout? It won't be saved.")){ restEnd=0; del(w.id); render(); } break;
    case "delw": if(confirm("Delete this workout from your history?")){ del(id); render(); } break;
    case "addbw": { const kg=numIn($("#bwkg").value), date=$("#bwdate").value; if(!(kg>0)||!date){ $("#bwkg").focus(); return; } const ex=bws().find(x=>x.date===date); put({kind:"bw",id:ex?ex.id:uid("b"),date,kg}); render(); break; }
    case "delbw": del(id); render(); break;
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="ftext") foodText=t.value;
  if(t.id==="libq"){ libQuery=t.value; const pos=t.selectionStart; render(); const n=$("#libq"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="progsel"){ progEx=t.value; render(); return; }
  if(t.id==="pl-rest"){ readPlanForm(); render(); return; }
  if(t.dataset.cmp){ const P=photos(); photoCmp=photoCmp||[P[P.length-1].id,P[0].id]; photoCmp[+t.dataset.cmp]=t.value; render(); return; }
  if(t.dataset.set0){ const v=numIn(t.value); if(v==null||v<0) return; const st=settings(); st[t.dataset.set0]=v; putSoon(st); return; }
  if(t.id==="importfile"){ const f=t.files&&t.files[0]; t.value=""; if(!f) return; f.text().then(txt=>{ const j=JSON.parse(txt); const d=j.docs||j; let n=0; Object.values(d).forEach(x=>{ if(x&&x.id&&x.kind){ put(x); n++; } }); alert("Imported "+n+" items."); render(); }).catch(()=>alert("That file isn't a valid backup.")); return; }
  if(t.id==="phfile"){ const f=t.files&&t.files[0]; t.value=""; if(!f) return;
    if(!assetsApi&&idb){ const k=uid("img"); idbDo("readwrite",st=>st.put(f,k)).then(()=>{ photoURL[k]=URL.createObjectURL(f); put({kind:"photo",id:uid("ph"),date:today(),assetId:k,local:true,created:Date.now()}); render(); }).catch(()=>alert("Couldn't save the photo on this phone.")); return; }
    if(!assetsApi) return; setSync("Uploading photo…");
    assetsApi.upload(f).then(r=>{ put({kind:"photo",id:uid("ph"),date:today(),assetId:r.id,created:Date.now()}); setSync("Photo saved"); render(); }).catch(e=>{ setSync("Couldn't upload: "+(e&&e.message||e&&e.code||"error")); }); return; }
  if(t.id==="fmeal"){ foodMeal=t.value; if(draft) render(); return; }
  if(t.id==="savelib"){ saveToLib=t.checked; return; }
  if(t.id==="photo"){ const f=t.files&&t.files[0]; t.value=""; if(f) lookup([f]); return; }
  if(t.dataset.dr){ const it=draft[+t.dataset.i]; const k=t.dataset.dr; it[k]= (k==="name"||k==="amount")?t.value:(numIn(t.value)||0); return; }
  if(t.dataset.set){ const v=numIn(t.value); if(v==null||v<=0) return; const s=settings(); s[t.dataset.set]=v; putSoon(s); return; }
  if(t.dataset.gstep){ const g=JSON.parse(JSON.stringify(docs[t.dataset.gstep])); g.steps[+t.dataset.i].done=t.checked; put(g); render(); return; }
  if(t.dataset.gcheck){ const g=JSON.parse(JSON.stringify(docs[t.dataset.gcheck])); g.done=t.checked; put(g); render(); return; }
  if(t.dataset.m==="mode"||t.dataset.m==="route"||t.dataset.g==="type"||t.dataset.g==="link"){ readForm(); render(); return; }
  const w=active(); if(!w||!t.dataset.wf) return;
  if(t.dataset.wf==="wname"){ w.name=t.value.trim()||w.name; putSoon(w); return; }
  const st=w.exercises[+t.dataset.i].sets[+t.dataset.j], val=t.value.replace(",",".").trim();
  if(t.dataset.wf==="w") st.w= val===""?"":(parseFloat(val)||0);
  if(t.dataset.wf==="r") st.r= val===""?"":(parseInt(val,10)||0);
  putSoon(w);
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&ev.target.id==="newex"){ ev.preventDefault(); addExercise(); } if(ev.key==="Enter"&&ev.target.id==="hab-new"){ ev.preventDefault(); const b=$('[data-act="habadd"]'); b&&b.click(); } if(ev.key==="Enter"&&ev.target.id==="pl-new"){ ev.preventDefault(); const b=$('[data-act="pladd"]'); b&&b.click(); } });
setInterval(()=>{ if(tab==="today") safeRender(); else try{ updateBadge(); }catch(e){} },60000);
setInterval(()=>{ const m=$(".wmeta"), w=active(); if(m&&w) m.textContent="Started "+new Date(w.startedAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" · "+dur(Date.now()-w.startedAt); },30000);

const SB_URL="https://nsaiocxxvlcgutqnkupc.supabase.co", SB_KEY="sb_publishable_gw3-zmAANRmQr1aLfW1vRQ_Cj3MIJGR";
const PKEY="lifelog.pending", SKEY="lifelog.lastsync";
let sb=null, sbUser=null, authMsg="", authBusy=false, flushing=false;
const pending=new Set(JSON.parse(localStorage.getItem(PKEY)||"[]"));
const savePending=()=>{ try{ localStorage.setItem(PKEY,JSON.stringify([...pending])); }catch(e){} };
supaMark=id=>{ pending.add(id); savePending(); clearTimeout(supaMark.t); supaMark.t=setTimeout(flush,400); };
async function flush(){
  if(!sb||!sbUser||flushing||!pending.size) return;
  flushing=true;
  try{
    const ids=[...pending].slice(0,200);
    const rows=ids.map(id=>docs[id]?{id,kind:docs[id].kind||"doc",data:docs[id],deleted:false}:{id,kind:"deleted",data:{},deleted:true});
    const {error}=await sb.from("lifelog_docs").upsert(rows,{onConflict:"user_id,id"});
    if(error) throw error;
    ids.forEach(id=>pending.delete(id)); savePending(); setSync("Synced");
  }catch(e){ setSync(navigator.onLine?"Couldn't sync — will retry":"Offline — changes saved on this phone"); }
  flushing=false;
  if(pending.size) setTimeout(flush,5000);
}
function applyRow(r){
  if(pending.has(r.id)) return;
  if(r.deleted) delete docs[r.id]; else docs[r.id]=r.data;
}
async function pull(){
  if(!sb||!sbUser) return;
  const since=localStorage.getItem(SKEY);
  let q=sb.from("lifelog_docs").select("id,data,deleted,updated_at").order("updated_at",{ascending:true}).limit(5000);
  if(since) q=q.gt("updated_at",since);
  const {data,error}=await q;
  if(error){ setSync("Couldn't sync — check your connection"); return; }
  const first=!since;
  const remoteIds=new Set((data||[]).map(r=>r.id));
  (data||[]).forEach(applyRow);
  if(first){ Object.keys(docs).forEach(id=>{ if(!remoteIds.has(id)) pending.add(id); }); savePending(); }
  if(data&&data.length) localStorage.setItem(SKEY,data[data.length-1].updated_at);
  saveLocal(); setSync("Synced"); safeRender(); flush();
}
async function onSignedIn(user){
  sbUser=user; mode="supa";
  sampleApi={edge:true}; canPhoto=true; window.__sb=sb;
  await pull();
  sb.channel("lifelog-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"lifelog_docs",filter:"user_id=eq."+user.id},p=>{ if(p.new&&p.new.id){ applyRow(p.new); saveLocal(); safeRender(); } }).subscribe();
  render();
}
async function supaInit(){
  if(!window.supabase||!window.supabase.createClient){ setSync("Saved on this device (sync unavailable)"); return; }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await sb.auth.getSession();
  if(data&&data.session) await onSignedIn(data.session.user); else render();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ pull(); flush(); } });
  window.addEventListener("online",()=>{ pull(); flush(); });
}

accountCard=()=>{
  if(!sbUser) return "";
  return `<section class="card"><div class="card-h">${cat("habit","Account","var(--muted)")}<span class="muted small">${pending.size?pending.size+" waiting to sync":"All synced"}</span></div>
    <p class="muted small" style="margin:0 0 12px">Signed in as ${esc(sbUser.email||"")}.</p>
    <div class="row"><button class="btn ghost small" data-act="export">Export backup</button><button class="btn ghost small" data-act="import">Import backup</button><button class="btn danger small" data-act="au-out">Log out</button></div>
    <input type="file" id="importfile" accept="application/json,.json" class="hidden"></section>`;
};
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||!sb) return;
  const act=b.dataset.act;
  if(act!=="au-in"&&act!=="au-up"&&act!=="au-out") return;
  if(act==="au-out"){ if(!confirm("Log out? Your data stays in your account.")) return; await sb.auth.signOut(); sbUser=null; mode="local"; sampleApi=null; localStorage.removeItem(SKEY); render(); return; }
  const email=($("#au-email").value||"").trim(), password=$("#au-pass").value||"";
  if(!email||password.length<6){ authMsg="Enter your email and a password of at least 6 characters."; render(); return; }
  authBusy=true; authMsg=""; render();
  if(act==="au-in"){ const {data,error}=await sb.auth.signInWithPassword({email,password}); authBusy=false; if(error){ authMsg=/confirm/i.test(error.message)?"Confirm your email first — check your inbox.":error.message; render(); return; } authMsg=""; await onSignedIn(data.user); }
  else { const {data,error}=await sb.auth.signUp({email,password}); authBusy=false; if(error){ authMsg=error.message; render(); return; } if(data.session){ await onSignedIn(data.user); } else { authMsg="Account created. Check your email and tap the confirmation link, then log in here."; render(); } }
});

initStore().then(()=>{ if(!assetsApi) initLocalPhotos(); });
if(!window.claude&&"serviceWorker" in navigator&&/^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
